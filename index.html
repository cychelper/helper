<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>投票、按讚、評論小幫手</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4EFE8; --card:#FBF8F2; --line:#E3D5B8; --line2:#CDB98F;
  --brown:#6B5A3E; --brown2:#55472F; --ink:#4A3B2A; --muted:#A4916F;
  --yellow:#E8D89A; --yellow2:#F3EBCB; --tan:#D4C4A0;
  --red:#D9483B; --blue:#3A8FD8; --green:#3BB54A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans TC",-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  padding-bottom:calc(86px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}

/* 標題 */
header{background:var(--card);border-bottom:2px solid var(--line);text-align:center;padding:12px 16px 12px;position:sticky;top:0;z-index:5}
.dots{color:var(--muted);letter-spacing:12px;font-size:9px;padding-left:12px}
h1{margin:2px 0 0;font-size:25px;font-weight:900;color:#4A3420;letter-spacing:1px}
.sub{color:var(--muted);font-size:13px;margin-top:2px;font-weight:500}
.callbtn{position:absolute;right:10px;top:12px;border:2px solid var(--line);background:var(--yellow2);color:var(--brown);
  border-radius:20px;padding:5px 10px;font-size:12px;font-weight:700}

main{padding:12px 14px 20px;max-width:560px;margin:0 auto}
.sec{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:700;font-size:13px;letter-spacing:2px;margin:18px 4px 8px}
.sec::after{content:"";flex:1;height:1px;background:var(--line)}
.sec:first-child{margin-top:6px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px}
.card.y{background:var(--yellow);border-color:var(--line2)}
.empty{color:var(--muted);text-align:center;padding:14px 0;font-size:14px}
.foot{text-align:center;color:var(--muted);font-size:18px;margin:22px 0 4px;opacity:.6;letter-spacing:6px}

/* 首頁 */
.hello{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 2px 0}
.hello .hi{font-size:16px}
.hello img{width:32px;height:32px;border-radius:50%;vertical-align:middle;margin-right:6px;border:2px solid var(--line)}
.mini{border:2px solid var(--line);background:var(--card);border-radius:20px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--brown);white-space:nowrap}
.date{color:var(--brown);font-weight:700;font-size:15px}
.status{font-size:24px;font-weight:900;margin:4px 0 8px;display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);display:inline-block;flex:none}
.dot.off{background:var(--red)}
.dot.slow{background:#E5A23B}
.note{background:#F2E8C0;border-radius:8px;padding:9px 12px;font-size:17px;color:#6E5D44}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 2px;border-bottom:1px dashed var(--line);font-size:18px;font-weight:700;cursor:pointer}
.li:last-child{border-bottom:0}
.li .go{color:var(--muted);font-size:13px;font-weight:500;white-space:nowrap}
.pill{font-size:11px;font-weight:700;border-radius:20px;padding:2px 8px;background:var(--yellow2);color:var(--brown);margin-left:6px;vertical-align:2px;white-space:nowrap}
.pill.g{background:#DFF0D8;color:#3C7A30}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.quick button{border:2px solid var(--line2);border-radius:16px;padding:16px 8px;font-size:17px;font-weight:900;color:var(--brown2)}
.quick .a{background:var(--yellow)} .quick .b{background:#A89A86;color:#fff;border-color:#998a74}

/* 行事曆 */
.cal{background:var(--card);border:2px solid var(--line);border-radius:16px;overflow:hidden}
.calh{background:var(--brown);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:10px 12px;font-weight:700;font-size:19px}
.calh button{border:0;background:rgba(255,255,255,.85);color:var(--brown);width:28px;height:28px;border-radius:50%;font-size:11px}
.wk,.grid{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.wk{padding:10px 4px 2px;font-weight:700;color:var(--muted)}
.grid{padding:0 4px 8px}
.d{border:0;background:none;height:44px;margin:2px;border-radius:8px;font-size:17px;font-weight:500;position:relative}
.sun{color:var(--red)} .sat{color:var(--blue)}
.d.today{background:var(--brown);color:#fff}
.d.sel{outline:2px solid var(--brown)}
.d i{position:absolute;bottom:5px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--brown)}
.d.today i{background:#fff}
i.t休息{background:var(--red)} i.t結帳日{background:var(--green)} i.t活動{background:#E5A23B}
.evs{border-top:1px solid var(--line);padding:6px 14px 10px}
.ev{display:flex;gap:10px;align-items:center;padding:7px 0;font-size:15px}
.ev b{color:var(--brown);min-width:44px}
.ev i{width:8px;height:8px;border-radius:50%;background:var(--brown);flex:none}

/* 接案 */
.me{background:var(--card);border:2px solid var(--line);border-radius:30px;padding:12px 18px;font-size:14px;display:flex;align-items:center;gap:10px}
.me small{color:var(--muted)}
.me b{font-size:16px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--yellow2);border:2px solid var(--line2);border-radius:16px;padding:14px 16px;margin-bottom:10px;cursor:pointer;transition:.15s}
.opt.sel{background:var(--yellow);border-color:var(--brown)}
.opt.full{opacity:.5;cursor:default}
.radio{width:24px;height:24px;border-radius:50%;border:2px solid var(--line2);background:#fff;flex:none;margin-top:4px;position:relative}
.opt.sel .radio{border-color:var(--brown)}
.opt.sel .radio::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--brown)}
.ob{flex:1;min-width:0}
.on{font-size:20px;font-weight:900}
.om{color:#7C6A4E;font-size:14px;margin-top:2px}
.tag{display:inline-block;margin-top:6px;background:#fff;border-radius:20px;padding:2px 10px;font-size:13px;font-weight:700;color:#3C7A30}
.desc{margin-top:8px;font-size:14px;line-height:1.6;white-space:pre-wrap;background:rgba(255,255,255,.5);border-radius:8px;padding:8px 10px}
.panel{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:16px;margin-top:4px}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.lab{font-weight:700;font-size:15px}
.step{display:flex;align-items:center;gap:6px}
.step button{width:40px;height:40px;border-radius:50%;border:2px solid var(--line2);background:var(--yellow2);font-size:22px;font-weight:700;color:var(--brown);line-height:1}
.step span{min-width:44px;text-align:center;font-size:24px;font-weight:900}
.in{width:100%;border:2px solid var(--line);background:#F7F1E6;border-radius:12px;padding:12px 14px;font-size:16px;outline:none}
.in:focus{border-color:var(--brown);background:#fff}
textarea.in{resize:vertical;line-height:1.5}
.warn{color:var(--red);font-weight:700;text-align:center;margin:14px 0 10px;min-height:1px}
.btn{display:block;width:100%;border:0;border-radius:14px;background:var(--brown);color:#fff;font-weight:700;font-size:17px;padding:15px;box-shadow:0 3px 0 #4f422c;margin-top:12px}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #4f422c}
.btn:disabled{background:var(--tan);box-shadow:0 3px 0 #bba97f}
.link{display:block;margin:12px auto 0;border:0;background:none;color:var(--muted);text-decoration:underline;font-size:14px}
.hint{text-align:center;color:var(--muted);padding:10px;font-size:15px}

/* 回報 */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line2);background:var(--yellow2);border-radius:24px;padding:9px 14px;font-weight:700;font-size:15px}
.chip.sel{background:var(--brown);border-color:var(--brown);color:#fff}
.shots{display:flex;flex-wrap:wrap;gap:10px}
.shot,.add{width:84px;height:84px;border-radius:12px;position:relative;flex:none}
.shot img{width:100%;height:100%;object-fit:cover;border-radius:12px;border:2px solid var(--line)}
.shot button{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:16px;line-height:1}
.add{border:2px dashed var(--line2);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);font-size:28px;cursor:pointer}
.add small{font-size:11px}
.add input{display:none}
.rli{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px dashed var(--line)}
.rli:last-child{border-bottom:0}
.rli b{font-size:15px;display:block}
.rli small{color:var(--muted);font-size:12px;display:block;margin-top:1px}
.rli .rn{color:var(--red)}
.st{font-size:12px;font-weight:700;border-radius:20px;padding:4px 10px;white-space:nowrap}
.st.p{background:var(--yellow2);color:#8A6D2B} .st.ok{background:#DFF0D8;color:#3C7A30} .st.ng{background:#F8DCD8;color:var(--red)}

/* 結帳 */
.mon{display:flex;align-items:center;justify-content:space-between;background:var(--brown);color:#fff;border-radius:14px;padding:8px 10px;font-weight:700;font-size:18px}
.mon button{border:0;background:rgba(255,255,255,.85);color:var(--brown);width:30px;height:30px;border-radius:50%;font-size:11px}
.big{font-size:40px;font-weight:900;margin:2px 0}
.big small{font-size:18px}
.kpis{display:flex;gap:8px;margin-top:6px}
.kpis div{flex:1;background:rgba(255,255,255,.55);border-radius:10px;padding:8px 4px;text-align:center;font-size:12px;color:#6E5D44}
.kpis b{display:block;font-size:20px;color:var(--ink)}

/* 手冊 */
details{background:var(--card);border:2px solid var(--line);border-radius:14px;margin-bottom:10px;overflow:hidden}
summary{list-style:none;padding:14px 16px;font-weight:900;font-size:17px;display:flex;justify-content:space-between;cursor:pointer}
summary::-webkit-details-marker{display:none}
summary::after{content:"＋";color:var(--muted)}
details[open] summary{background:var(--yellow)}
details[open] summary::after{content:"－"}
.bk{padding:12px 16px 16px;white-space:pre-wrap;line-height:1.8;font-size:15px}


/* 任務 */
.task{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:12px}
.task.ng{border-color:#E9A79F}
.th{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.th b{font-size:17px}
.th small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.money{font-weight:900;color:var(--brown);font-size:18px;white-space:nowrap}
.ctt{background:var(--yellow2);border-radius:10px;padding:10px 12px;margin:10px 0 8px;font-size:15px;line-height:1.6;white-space:pre-wrap;word-break:break-all}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.sbtn{border:2px solid var(--line2);background:var(--card);border-radius:20px;padding:7px 12px;font-size:14px;font-weight:700;color:var(--brown);text-decoration:none;display:inline-flex;align-items:center;gap:4px}
.sbtn.dark{background:var(--brown);border-color:var(--brown);color:#fff}
.rnote{background:#F8DCD8;color:var(--red);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:700;margin-top:8px}
.form{border-top:1px dashed var(--line);margin-top:12px;padding-top:12px;display:grid;gap:10px}
.notice{background:#FFF4D6;border:2px dashed var(--line2);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;margin-top:10px}

/* 底部選單 */
nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:2px solid var(--line);display:flex;
  padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:10;max-width:100%}
nav.tabs button{flex:1;border:0;background:none;color:var(--muted);font-size:11px;font-weight:700;padding:5px 0 4px;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:12px;position:relative}
nav.tabs .ic{font-size:21px;filter:grayscale(1);opacity:.55}
nav.tabs button.on{color:var(--brown);background:var(--yellow2)}
nav.tabs button.on .ic{filter:none;opacity:1}
nav.tabs .badge{position:absolute;top:0;right:18%;background:var(--red);color:#fff;font-size:10px;border-radius:10px;padding:0 5px;min-width:16px}

/* 彈窗 / 提示 */
.mask{position:fixed;inset:0;background:rgba(60,45,25,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.sheet h3{margin:0 0 4px;font-size:20px;text-align:center}
.sheet p{margin:0 0 12px;color:var(--muted);text-align:center;font-size:14px}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;
  padding:11px 18px;border-radius:24px;font-size:15px;font-weight:700;z-index:40;max-width:88%;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.busy{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:rgba(244,239,232,.6)}
.busy div{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:14px 22px;font-weight:700;color:var(--brown)}
.busy span{display:inline-block;animation:hop .6s infinite alternate}
@keyframes hop{to{transform:translateY(-5px)}}
.boot{text-align:center;padding:80px 20px;color:var(--muted)}
.boot .big{font-size:40px}
</style>
</head>
<body>

<header>
  <div class="dots">✦ ✦ ✦</div>
  <h1 id="title">小幫手</h1>
  <div class="sub" id="sub">載入中…</div>
  <button class="callbtn" id="callbtn" onclick="openCall()" style="display:none">🔔 呼叫管理員</button>
</header>

<main id="main"><div class="boot"><div class="big">🐰</div>載入中，請稍等…</div></main>

<nav class="tabs" id="tabs" style="display:none">
  <button data-tab="home"   onclick="go('home')"><span class="ic">🗓️</span>公告</button>
  <button data-tab="take"   onclick="go('take')"><span class="ic">✋</span>接案</button>
  <button data-tab="report" onclick="go('report')"><span class="ic">📋</span>任務</button>
  <button data-tab="bill"   onclick="go('bill')"><span class="ic">💰</span>結帳</button>
  <button data-tab="book"   onclick="go('book')"><span class="ic">📖</span>手冊</button>
</nav>

<div id="layer"></div>

<script>
/* =========================================================
 * ⚙️ 設定：兩個都填好就會連到真的系統；留空會進入「展示模式」
 * ========================================================= */
const CONFIG = {
  LIFF_ID: '2012708739-tjYC2nsi',   // LINE Developers 裡 LIFF 的 ID，例如 2001234567-AbCdEfGh
  API_URL: 'https://script.google.com/macros/s/AKfycbzb1HznzcVUm46Ml0ZaC-SylhtBvMyHg6TQsODN_HcD5-0yx0yzFaev1l_uiufc581mTg/exec'  // Apps Script 部署後的網址（…/exec 結尾）
};

const DEMO = !CONFIG.LIFF_ID || !CONFIG.API_URL;
const VIEWS = {
  home:   { t: '公告板',   s: '' },
  take:   { t: '我要接案', s: '選擇案件並填寫可接帳號數量' },
  report: { t: '我的任務', s: '複製內容 → 去執行 → 回報' },
  bill:   { t: '我的結帳', s: '每月審核通過的金額與點數' },
  book:   { t: '接案手冊', s: '接案前請先看過一次喔' }
};
const CN_MONTH = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const WEEK = ['日','一','二','三','四','五','六'];

let idToken = '';
const state = {
  tab: 'home', me: null, board: {}, cases: [], events: [], handbook: [], tasks: [], stats: {},
  calMonth: new Date(), selDate: null,
  takeSel: null, takeCount: 1, takeNote: '',
  openTask: null, repAcc: lsGet('repAcc') || '', repUrl: '', images: [], showDone: false,
  billMonth: ymc(new Date()), bill: null
};

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
function pad(n) { return String(n).padStart(2, '0'); }
function ymc(d) { return d.getFullYear() + pad(d.getMonth() + 1); }          // 202701
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function md(s) { s = String(s || ''); return s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : ''; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(n) { return '$' + (Number(n) || 0).toLocaleString(); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function busy(on, msg) {
  const old = $('.busy'); if (old) old.remove();
  if (on) { const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = `<div><span>🐾</span> ${esc(msg || '處理中…')}</div>`; document.body.appendChild(b); }
}
function stCls(s) { return s === '通過' ? 'ok' : s === '退回' ? 'ng' : 'p'; }
function isUrl(s) { return /^https?:\/\//.test(String(s || '')); }
function taskById(id) { return state.tasks.find(t => t.id === id); }

/* ---------- 跟後端講話 ---------- */
async function api(action, data) {
  data = data || {};
  if (DEMO) return demoApi(action, data);
  const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, idToken }, data)) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '發生錯誤，請稍後再試');
  return j.data;
}
function applyInit(d) { Object.assign(state, d); }

/* ---------- 開機 ---------- */
async function boot() {
  try {
    if (!DEMO) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
        s.onload = res; s.onerror = () => rej(new Error('LINE 元件載入失敗，請檢查網路'));
        document.head.appendChild(s);
      });
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      idToken = liff.getIDToken();
    }
    const p = new URLSearchParams(location.search);
    let t = p.get('tab');
    if (!t && p.get('liff.state')) t = new URLSearchParams(p.get('liff.state').replace(/^[^?]*\?/, '')).get('tab');
    if (t === 'call') { state.openCall = true; t = 'home'; }
    if (t && VIEWS[t]) state.tab = t;

    const d = await api('init');
    if (d.pending) {   // 還沒通過管理員審核
      $('#title').textContent = '等待審核'; $('#sub').textContent = '';
      $('#main').innerHTML = `<div class="boot"><div class="big">🐰</div>
        <p>嗨 <b>${esc(d.me.name || '')}</b>，已收到你的申請！<br>管理員審核通過後就可以使用囉。<br><br>通過後，再從 LINE 選單打開一次就好。</p>
        <button class="btn" onclick="location.reload()">重新整理</button></div>`;
      return;
    }
    applyInit(d);
    $('#tabs').style.display = ''; $('#callbtn').style.display = '';
    render();
    if (state.openCall) openCall();
  } catch (e) {
    $('#sub').textContent = '';
    $('#main').innerHTML = `<div class="boot"><div class="big">🙈</div><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">重新整理</button></div>`;
  }
}

function go(t) {
  state.tab = t;
  if (t === 'bill') state.bill = null;
  render(); window.scrollTo(0, 0);
}

function render() {
  const v = VIEWS[state.tab];
  $('#title').textContent = v.t;
  $('#sub').textContent = state.tab === 'home' ? (state.board.updated ? '最後更新：' + md(state.board.updated) + ' ' + String(state.board.updated).slice(11, 16) : '') : v.s;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));

function vCal() {
  const d = state.calMonth, y = d.getFullYear(), m = d.getMonth();
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  const today = ymd(new Date());
  const byDate = {};
  state.events.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let day = 1; day <= days; day++) {
    const key = `${y}-${pad(m + 1)}-${pad(day)}`, dow = (first + day - 1) % 7, es = byDate[key];
    cells += `<button class="d ${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''} ${key === today ? 'today' : ''} ${key === state.selDate ? 'sel' : ''}" onclick="selDate('${key}')">${day}${es ? `<i class="t${esc(es[0].type)}"></i>` : ''}</button>`;
  }
  const prefix = `${y}-${pad(m + 1)}`;
  const list = state.selDate ? (byDate[state.selDate] || []) : state.events.filter(e => e.date.startsWith(prefix)).sort((a, b) => a.date < b.date ? -1 : 1);
  const evHtml = list.length
    ? list.map(e => `<div class="ev"><i class="t${esc(e.type)}"></i><b>${md(e.date)}</b><span>${esc(e.title)}</span></div>`).join('')
    : `<div class="empty" style="padding:8px 0">${state.selDate ? md(state.selDate) + ' 沒有安排' : '這個月沒有特別安排'}</div>`;
  return `<div class="cal">
    <div class="calh"><button onclick="calMove(-1)">◀</button><span>${y}年 ${CN_MONTH[m]}</span><button onclick="calMove(1)">▶</button></div>
    <div class="wk">${WEEK.map((w, i) => `<span class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</span>`).join('')}</div>
    <div class="grid">${cells}</div>
    <div class="evs">${evHtml}</div>
  </div>`;
}

function rli(t) {
  return `<div class="rli"><div><b>${esc(t.platform)} ${esc(t.type)}${t.qty > 1 ? ' × ' + t.qty : ''}</b><small>${esc(t.caseId || t.code)} ・ ${md(t.time)} ・ ${esc(t.account || '')}</small>${t.status === '退回' && t.reviewNote ? `<small class="rn">退回原因：${esc(t.reviewNote)}</small>` : ''}</div>
    <span class="st ${stCls(t.status)}">${esc(t.status)}${t.status === '通過' ? ' ' + money(t.amount) : ''}</span></div>`;
}
function copyText(id) {
  const txt = taskById(id).content;
  const done = () => toast('已複製 ✓');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, cb) {
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) { toast('請長按內容手動複製'); }
  ta.remove();
}
function openForm(id) { state.openTask = id; state.repUrl = ''; state.images = []; render(); }
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => rej(new Error('這張圖片讀不到，換一張試試'));
    img.src = url;
  });
}
async function addImgs(input) {
  const files = Array.from(input.files).slice(0, 5 - state.images.length);
  busy(true, '處理圖片中…');
  try { for (const f of files) state.images.push(await compress(f)); } catch (e) { toast(e.message); }
  busy(false); render();
}
function rmImg(i) { state.images.splice(i, 1); render(); }

  lsSet('repAcc', state.repAcc.trim());

  try {

    state.openTask = null; state.repUrl = ''; state.images = [];
    render(); toast('回報成功！等管理員審核 🐰');
  } catch (e) { busy(false); toast(e.message); }
}

    }
    if (action === 'call' || action === 'dispute') return res({});
    res(clone());
  }, 350));

const WEEK = ['日','一','二','三','四','五','六'];

let idToken = '';
const state = {
  tab: 'home', me: null, board: {}, cases: [], events: [], handbook: [], tasks: [], stats: {},
  calMonth: new Date(), selDate: null,
  takeSel: null, takeCount: 1, takeNote: '',
  openTask: null, repAcc: lsGet('repAcc') || '', repUrl: '', images: [], showDone: false,
  billMonth: ymc(new Date()), bill: null
};

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
function pad(n) { return String(n).padStart(2, '0'); }
function ymc(d) { return d.getFullYear() + pad(d.getMonth() + 1); }          // 202701
function ymd(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function md(s) { s = String(s || ''); return s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : ''; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function money(n) { return '$' + (Number(n) || 0).toLocaleString(); }
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}
function busy(on, msg) {
  const old = $('.busy'); if (old) old.remove();
  if (on) { const b = document.createElement('div'); b.className = 'busy'; b.innerHTML = `<div><span>🐾</span> ${esc(msg || '處理中…')}</div>`; document.body.appendChild(b); }
}
function stCls(s) { return s === '通過' ? 'ok' : s === '退回' ? 'ng' : 'p'; }
function isUrl(s) { return /^https?:\/\//.test(String(s || '')); }
function taskById(id) { return state.tasks.find(t => t.id === id); }

/* ---------- 跟後端講話 ---------- */
async function api(action, data) {
  data = data || {};
  if (DEMO) return demoApi(action, data);
  const r = await fetch(CONFIG.API_URL, { method: 'POST', body: JSON.stringify(Object.assign({ action, idToken }, data)) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || '發生錯誤，請稍後再試');
  return j.data;
}
function applyInit(d) { Object.assign(state, d); }

/* ---------- 開機 ---------- */
async function boot() {
  try {
    if (!DEMO) {
      await new Promise((res, rej) => {
        const s = document.createElement('script');
        s.src = 'https://static.line-scdn.net/liff/edge/2/sdk.js';
        s.onload = res; s.onerror = () => rej(new Error('LINE 元件載入失敗，請檢查網路'));
        document.head.appendChild(s);
      });
      await liff.init({ liffId: CONFIG.LIFF_ID });
      if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return; }
      idToken = liff.getIDToken();
    }
    const p = new URLSearchParams(location.search);
    let t = p.get('tab');
    if (!t && p.get('liff.state')) t = new URLSearchParams(p.get('liff.state').replace(/^[^?]*\?/, '')).get('tab');
    if (t === 'call') { state.openCall = true; t = 'home'; }
    if (t && VIEWS[t]) state.tab = t;

    applyInit(await api('init'));
    $('#tabs').style.display = ''; $('#callbtn').style.display = '';
    render();
    if (state.openCall) openCall();
  } catch (e) {
    $('#sub').textContent = '';
    $('#main').innerHTML = `<div class="boot"><div class="big">🙈</div><p>${esc(e.message)}</p><button class="btn" onclick="location.reload()">重新整理</button></div>`;
  }
}

function go(t) {
  state.tab = t;
  if (t === 'bill') state.bill = null;
  render(); window.scrollTo(0, 0);
}

function render() {
  const v = VIEWS[state.tab];
  $('#title').textContent = v.t;
  $('#sub').textContent = state.tab === 'home' ? (state.board.updated ? '最後更新：' + md(state.board.updated) + ' ' + String(state.board.updated).slice(11, 16) : '') : v.s;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === state.tab));
  const tb = document.querySelector('nav.tabs [data-tab=report]');
  const old = tb.querySelector('.badge'); if (old) old.remove();
  if (state.stats.todo) tb.insertAdjacentHTML('beforeend', `<span class="badge">${state.stats.todo}</span>`);
  $('#main').innerHTML = { home: vHome, take: vTake, report: vTasks, bill: vBill, book: vBook }[state.tab]();
  if (state.tab === 'bill' && !state.bill) loadBill();
}

/* =========================================================
 * 公告板
 * ========================================================= */
function vHome() {
  const b = state.board, st = state.stats;
  const dotCls = /休息|暫停|不回/.test(b.status) ? 'off' : /慢|晚/.test(b.status) ? 'slow' : '';
  const now = new Date();
  return `
  <div class="hello">
    <div class="hi">${state.me.picture ? `<img src="${esc(state.me.picture)}" alt="">` : '🐰 '}嗨，<b>${esc(state.me.name)}</b></div>
    <button class="mini" onclick="go('bill')">本月 ${money(st.amount)} ・ ${st.points} 點 ›</button>
  </div>
  ${state.me.bound ? '' : `<div class="notice">👋 第一次使用嗎？管理員幫你開通後，派給你的任務就會出現在「我的任務」。<br>等太久可以按右上角「呼叫管理員」。</div>`}

  <div class="sec">每日行程</div>
  <div class="card y">
    <div class="date">${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日（${WEEK[now.getDay()]}）</div>
    <div class="status"><i class="dot ${dotCls}"></i>${esc(b.status || '—')}</div>
    ${b.note ? `<div class="note">${esc(b.note)}</div>` : ''}
  </div>

  <div class="quick">
    <button class="a" onclick="go('report')">📋 我的任務${st.todo ? `（${st.todo}）` : ''}</button>
    <button class="b" onclick="go('take')">✋ 我要接案</button>
  </div>

  <div class="sec">目前案件</div>
  <div class="card">
    ${state.cases.length ? state.cases.map((c, i) => `
      <div class="li" onclick="pickTake(${i})">
        <span>• ${esc(c.id)}${esc(c.name)}${c.status === '招募中' ? '<span class="pill g">招募中</span>' : ''}${c.mine ? '<span class="pill">已登記</span>' : ''}</span>
        <span class="go">${c.status === '招募中' ? '去登記 ›' : '進行中'}</span>
      </div>`).join('') : '<div class="empty">目前沒有案件，休息一下 ☕</div>'}
  </div>

  <div class="sec">本月行事曆</div>
  ${vCal()}
  <div class="foot">🐰🐱🐩</div>`;
}

function vCal() {
  const d = state.calMonth, y = d.getFullYear(), m = d.getMonth();
  const first = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
  const today = ymd(new Date());
  const byDate = {};
  state.events.forEach(e => (byDate[e.date] = byDate[e.date] || []).push(e));
  let cells = '';
  for (let i = 0; i < first; i++) cells += '<div></div>';
  for (let day = 1; day <= days; day++) {
    const key = `${y}-${pad(m + 1)}-${pad(day)}`, dow = (first + day - 1) % 7, es = byDate[key];
    cells += `<button class="d ${dow === 0 ? 'sun' : dow === 6 ? 'sat' : ''} ${key === today ? 'today' : ''} ${key === state.selDate ? 'sel' : ''}" onclick="selDate('${key}')">${day}${es ? `<i class="t${esc(es[0].type)}"></i>` : ''}</button>`;
  }
  const prefix = `${y}-${pad(m + 1)}`;
  const list = state.selDate ? (byDate[state.selDate] || []) : state.events.filter(e => e.date.startsWith(prefix)).sort((a, b) => a.date < b.date ? -1 : 1);
  const evHtml = list.length
    ? list.map(e => `<div class="ev"><i class="t${esc(e.type)}"></i><b>${md(e.date)}</b><span>${esc(e.title)}</span></div>`).join('')
    : `<div class="empty" style="padding:8px 0">${state.selDate ? md(state.selDate) + ' 沒有安排' : '這個月沒有特別安排'}</div>`;
  return `<div class="cal">
    <div class="calh"><button onclick="calMove(-1)">◀</button><span>${y}年 ${CN_MONTH[m]}</span><button onclick="calMove(1)">▶</button></div>
    <div class="wk">${WEEK.map((w, i) => `<span class="${i === 0 ? 'sun' : i === 6 ? 'sat' : ''}">${w}</span>`).join('')}</div>
    <div class="grid">${cells}</div>
    <div class="evs">${evHtml}</div>
  </div>`;
}
function calMove(n) { const d = state.calMonth; state.calMonth = new Date(d.getFullYear(), d.getMonth() + n, 1); state.selDate = null; render(); }
function selDate(k) { state.selDate = state.selDate === k ? null : k; render(); }
function pickTake(i) { if (state.cases[i].status !== '招募中') { toast('這個案件已停止登記'); return; } state.takeSel = i; const c = state.cases[i]; state.takeCount = c.mine || 1; state.takeNote = c.mineNote || ''; go('take'); }

/* =========================================================
 * 我要接案
 * ========================================================= */
function vTake() {
  const list = state.cases.map((c, i) => ({ c, i })).filter(x => x.c.status === '招募中');
  if (!list.length) return `<div class="card"><div class="empty">目前沒有招募中的案件<br>有新案件會公告在公告板 🐰</div></div>`;
  const sel = state.takeSel != null && state.cases[state.takeSel] && state.cases[state.takeSel].status === '招募中' ? state.cases[state.takeSel] : null;
  return `
  <div class="me"><small>LINE 帳號</small><b>${esc(state.me.name)}</b><small style="margin-left:auto">✓ 自動帶入</small></div>
  <div class="sec">選擇案件</div>
  ${list.map(({ c, i }) => {
    const full = c.quota && c.count >= c.quota && !c.mine;
    const on = state.takeSel === i;
    return `<div class="opt ${on ? 'sel' : ''} ${full ? 'full' : ''}" onclick="${full ? `toast('名額已滿')` : `selTake(${i})`}">
      <i class="radio"></i>
      <div class="ob">
        <div class="on">${esc(c.name)}</div>
        <div class="om">已登記 ${c.count} 人${c.quota ? ` / 名額 ${c.quota}` : ''}${c.price ? ` ・ 每則 ${money(c.price)}` : ''}${c.deadline ? ` ・ ${md(c.deadline)} 截止` : ''}${full ? ' ・ 已額滿' : ''}</div>
        ${c.mine ? `<div class="tag">✓ 你已登記 ${c.mine} 個帳號</div>` : ''}
        ${on && c.desc ? `<div class="desc">${esc(c.desc)}</div>` : ''}
      </div>
    </div>`;
  }).join('')}
  ${sel ? `
  <div class="panel">
    <div class="row"><span class="lab">可接帳號數量</span>
      <div class="step"><button onclick="stepCount(-1)">−</button><span id="cnt">${state.takeCount}</span><button onclick="stepCount(1)">＋</button></div>
    </div>
    <div style="margin-top:12px"><input class="in" placeholder="備註（選填，例如：只有 Dcard 帳號）" value="${esc(state.takeNote)}" oninput="state.takeNote=this.value"></div>
  </div>
  <button class="btn" onclick="submitTake()">${sel.mine ? '更新登記' : '送出登記'} 🐾</button>
  ${sel.mine ? `<button class="link" onclick="cancelTake(this)">取消這個案件的登記</button>` : ''}`
  : `<div class="hint">👆 先點選要接的案件</div>`}
  <div class="foot">🐰🐱🐩</div>`;
}
function selTake(i) { state.takeSel = i; const c = state.cases[i]; state.takeCount = c.mine || 1; state.takeNote = c.mineNote || ''; render(); }
function stepCount(n) { state.takeCount = Math.max(1, Math.min(99, state.takeCount + n)); $('#cnt').textContent = state.takeCount; }
async function submitTake() {
  const c = state.cases[state.takeSel];
  busy(true, '登記中…');
  try {
    applyInit(await api('signup', { caseId: c.id, count: state.takeCount, note: state.takeNote }));
    busy(false); toast(`登記成功！${c.name} × ${state.takeCount} 個帳號`);
    state.takeSel = state.cases.findIndex(x => x.id === c.id); render();
  } catch (e) { busy(false); toast(e.message); }
}
async function cancelTake(btn) {
  const c = state.cases[state.takeSel];
  if (!btn.dataset.sure) { btn.dataset.sure = 1; btn.textContent = '確定要取消嗎？再按一次'; btn.style.color = 'var(--red)'; return; }
  busy(true, '取消中…');
  try {
    applyInit(await api('unsignup', { caseId: c.id }));
    busy(false); toast('已取消登記'); state.takeSel = null; render();
  } catch (e) { busy(false); toast(e.message); }
}

/* =========================================================
 * 我的任務
 * ========================================================= */
function vTasks() {
  const todo = state.tasks.filter(t => t.status === '待執行' || t.status === '退回')
    .sort((a, b) => (a.status === '退回' ? -1 : 0) - (b.status === '退回' ? -1 : 0));
  const wait = state.tasks.filter(t => t.status === '已回報');
  const done = state.tasks.filter(t => t.status === '通過');
  return `
  <div class="sec">要做的（${todo.length}）</div>
  ${todo.length ? todo.map(taskCard).join('') : `<div class="card"><div class="empty">${state.me.bound ? '目前沒有任務 🎉<br>可以去「我要接案」登記新案件' : '管理員開通後，任務會出現在這裡'}</div></div>`}

  ${wait.length ? `<div class="sec">等待審核（${wait.length}）</div>
  <div class="card">${wait.map(rli).join('')}</div>` : ''}

  ${done.length ? `<div class="sec">最近通過</div>
  <div class="card">${(state.showDone ? done : done.slice(0, 3)).map(rli).join('')}
    ${done.length > 3 && !state.showDone ? `<button class="link" onclick="state.showDone=true;render()">看更多</button>` : ''}</div>` : ''}
  <div class="foot">🐰🐱🐩</div>`;
}

function taskCard(t) {
  const open = state.openTask === t.id;
  const text = t.content && !isUrl(t.content) ? t.content : '';
  const link = isUrl(t.link) ? t.link : (isUrl(t.content) ? t.content : '');
  return `<div class="task ${t.status === '退回' ? 'ng' : ''}">
    <div class="th">
      <div><b>${esc(t.platform)} ${esc(t.type)}${t.qty > 1 ? ` × ${t.qty}` : ''}</b><small>${esc(t.caseId || t.code)}${t.vendor ? ' ・ ' + esc(t.vendor) : ''}</small></div>
      <span class="money">${money(t.amount)}</span>
    </div>
    ${t.status === '退回' ? `<div class="rnote">被退回：${esc(t.reviewNote || '請重新回報')}</div>` : ''}
    ${text ? `<div class="ctt">${esc(text)}</div>` : ''}
    ${t.note ? `<div style="color:var(--muted);font-size:13px;margin:4px 0 8px">📌 ${esc(t.note)}</div>` : ''}
    <div class="acts">
      ${text ? `<button class="sbtn" onclick="copyText('${t.id}')">📋 複製內容</button>` : ''}
      ${link ? `<a class="sbtn" href="${esc(link)}" target="_blank" rel="noopener">🔗 開啟連結</a>` : ''}
      ${open ? '' : `<button class="sbtn dark" style="margin-left:auto" onclick="openForm('${t.id}')">做完了，回報 ›</button>`}
    </div>
    ${open ? `
    <div class="form">
      <input class="in" placeholder="使用的帳號名稱（會幫你記住）" value="${esc(state.repAcc)}" oninput="state.repAcc=this.value">
      <input class="in" placeholder="執行網址（貼上留言或貼文的連結）" value="${esc(state.repUrl)}" oninput="state.repUrl=this.value">
      <div class="shots">
        ${state.images.map((src, i) => `<div class="shot"><img src="${src}" alt=""><button onclick="rmImg(${i})">×</button></div>`).join('')}
        ${state.images.length < 5 ? `<label class="add">＋<small>截圖</small><input type="file" accept="image/*" multiple onchange="addImgs(this)"></label>` : ''}
      </div>
      <div class="warn" id="repWarn" style="margin:0"></div>
      <button class="btn" style="margin-top:0" onclick="submitReport('${t.id}')">送出回報 🐾</button>
      <button class="link" style="margin-top:0" onclick="state.openTask=null;render()">先不要</button>
    </div>` : ''}
  </div>`;
}
function rli(t) {
  return `<div class="rli"><div><b>${esc(t.platform)} ${esc(t.type)}${t.qty > 1 ? ' × ' + t.qty : ''}</b><small>${esc(t.caseId || t.code)} ・ ${md(t.time)} ・ ${esc(t.account || '')}</small>${t.status === '退回' && t.reviewNote ? `<small class="rn">退回原因：${esc(t.reviewNote)}</small>` : ''}</div>
    <span class="st ${stCls(t.status)}">${esc(t.status)}${t.status === '通過' ? ' ' + money(t.amount) : ''}</span></div>`;
}
function copyText(id) {
  const txt = taskById(id).content;
  const done = () => toast('已複製 ✓');
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt, done));
  else fallbackCopy(txt, done);
}
function fallbackCopy(txt, cb) {
  const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0';
  document.body.appendChild(ta); ta.select();
  try { document.execCommand('copy'); cb(); } catch (e) { toast('請長按內容手動複製'); }
  ta.remove();
}
function openForm(id) { state.openTask = id; state.repUrl = ''; state.images = []; render(); }
function compress(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, 1280 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => rej(new Error('這張圖片讀不到，換一張試試'));
    img.src = url;
  });
}
async function addImgs(input) {
  const files = Array.from(input.files).slice(0, 5 - state.images.length);
  busy(true, '處理圖片中…');
  try { for (const f of files) state.images.push(await compress(f)); } catch (e) { toast(e.message); }
  busy(false); render();
}
function rmImg(i) { state.images.splice(i, 1); render(); }
async function submitReport(id) {
  const w = $('#repWarn');
  if (!state.repAcc.trim()) { w.textContent = '⚠️ 請填寫使用的帳號名稱'; return; }
  if (!state.repUrl.trim() && !state.images.length) { w.textContent = '⚠️ 請貼執行網址或上傳截圖'; return; }
  lsSet('repAcc', state.repAcc.trim());
  busy(true, state.images.length ? '送出中，截圖上傳要幾秒鐘…' : '送出中…');
  try {
    applyInit(await api('report', { taskId: id, account: state.repAcc.trim(), url: state.repUrl.trim(), images: state.images }));
    busy(false);
    state.openTask = null; state.repUrl = ''; state.images = [];
    render(); toast('回報成功！等管理員審核 🐰');
  } catch (e) { busy(false); toast(e.message); }
}

/* =========================================================
 * 我的結帳
 * ========================================================= */
function vBill() {
  const y = +state.billMonth.slice(0, 4), m = +state.billMonth.slice(4);
  const b = state.bill;
  let body = '<div class="empty">讀取中…</div>';
  if (b) {
    const groups = {};
    b.items.forEach(r => (groups[r.code] = groups[r.code] || []).push(r));
    body = `
    <div class="card y" style="margin-top:12px">
      <div class="date">${m} 月結帳金額（含集點卡）</div>
      <div class="big">${money(b.final)}</div>
      <div class="kpis">
        <div><b>${money(b.total)}</b>任務金額</div>
        <div><b>${b.points}</b>點數</div>
        <div><b>${b.cards}</b>集點卡</div>
      </div>
      <div style="font-size:12px;color:#6E5D44;margin-top:8px">每 10 元 1 點・50 點＝1 張集點卡・每張多 $50</div>
    </div>
    ${b.pending || b.rejected ? `<p style="text-align:center;color:var(--muted);font-size:13px">另外還有 ${b.pending} 筆待審核${b.rejected ? `、<b style="color:var(--red)">${b.rejected} 筆被退回</b>` : ''}</p>` : ''}
    ${b.personalUrl ? `<a class="sbtn" style="display:flex;justify-content:center;margin:10px 0" href="${esc(b.personalUrl)}" target="_blank" rel="noopener">📄 打開我的工作表單</a>` : ''}
    ${Object.keys(groups).map(k => {
      const ok = groups[k].filter(r => r.status === '通過');
      return `<div class="sec">${esc(k)}　${money(ok.reduce((s, r) => s + (Number(r.amount) || 0), 0))}</div>
      <div class="card">${groups[k].map(r => rli(r) + (r.status === '通過' ? `<div style="text-align:right;margin:-6px 0 6px"><button class="link" style="margin:0;display:inline;font-size:12px" onclick="openDispute('${r.id}')">金額有誤？</button></div>` : '')).join('')}</div>`;
    }).join('') || '<div class="card" style="margin-top:12px"><div class="empty">這個月還沒有紀錄</div></div>'}`;
  }
  return `<div class="mon"><button onclick="billMove(-1)">◀</button><span>${y}年 ${m}月</span><button onclick="billMove(1)">▶</button></div>${body}<div class="foot">🐰🐱🐩</div>`;
}
function billMove(n) { const y = +state.billMonth.slice(0, 4), m = +state.billMonth.slice(4); state.billMonth = ymc(new Date(y, m - 1 + n, 1)); state.bill = null; render(); }
async function loadBill() {

function openCall() {
  const quick = ['還沒收到任務', '結帳金額有問題', '帳號被限制了', '想問案件細節'];
  $('#layer').innerHTML = `<div class="mask" onclick="if(event.target===this)closeCall()"><div class="sheet">
    <h3>🔔 呼叫管理員</h3><p>管理員看到會盡快回覆你</p>
    <div class="chips" style="justify-content:center;margin-bottom:12px">${quick.map(q => `<button class="chip" onclick="document.getElementById('callMsg').value='${q}：'">${q}</button>`).join('')}</div>
    <textarea id="callMsg" class="in" rows="4" placeholder="想問什麼直接寫在這裡"></textarea>
    <button class="btn" onclick="sendCall()">送出 🐾</button>
    <button class="link" onclick="closeCall()">先不用</button>
  </div></div>`;
}
function closeCall() { $('#layer').innerHTML = ''; }
async function sendCall() {
  const msg = $('#callMsg').value.trim();
  if (!msg) { toast('請寫一下要問什麼'); return; }
  busy(true, '送出中…');
  try { await api('call', { message: msg }); busy(false); closeCall(); toast('已通知管理員 🔔'); }
  catch (e) { busy(false); toast(e.message); }
}

function demoApi(action, d) {
  return new Promise(res => setTimeout(() => {
    const clone = () => JSON.parse(JSON.stringify(demo));
    if (action === 'signup') { const c = demo.cases.find(x => x.id === d.caseId); if (!c.mine) c.count++; c.mine = d.count; c.mineNote = d.note; }
    if (action === 'unsignup') { const c = demo.cases.find(x => x.id === d.caseId); c.mine = 0; c.count--; }
    if (action === 'report') { const t = demo.tasks.find(x => x.id === d.taskId); Object.assign(t, { status: '已回報', account: d.account, time: ymd(new Date()) + ' 12:00' }); demo.stats.todo--; demo.stats.pending++; }
    if (action === 'bill') {
      const items = demo.tasks.filter(r => r.time && r.time.replace('-', '').startsWith(d.month));
      const total = items.filter(r => r.status === '通過').reduce((s, r) => s + r.amount, 0);
      const pts = total / 10, cards = pts / 50;
      return res({ month: d.month, items, total, points: pts, cards: Math.round(cards * 100) / 100, final: Math.floor(cards) * 50 + total, personalUrl: demo.me.personalUrl, approved: items.filter(r => r.status === '通過').length, pending: items.filter(r => r.status === '已回報').length, rejected: 0 });
    }
    if (action === 'call' || action === 'dispute') return res({});
    res(clone());
  }, 350));
}
